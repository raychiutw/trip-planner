name = "trip-planner"
compatibility_date = "2024-12-01"
# nodejs_compat：V2 OAuth spike（oidc-provider 依賴 koa / node:crypto 等 Node shim）
# 若 spike 結論是 fallback 到 openauthjs + KV，應移除此 flag
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# CF Pages 慣例：production 的 D1 binding 須走 `[[env.production.d1_databases]]` 才會注入
# （頂層 `[[d1_databases]]` 只套用 preview）。目前只有 functions/s、functions/trip 讀 `DB`。
[[env.production.d1_databases]]
binding = "DB"
database_name = "trip-planner-db"
database_id = "d61c42d5-8083-4e18-9b6c-70e133e37322"

# 以下兩個 var 目前 Pages Functions 都沒讀（舊入口已於 #1627 刪除）；保留值不動，是否移除另評估。
# PUBLIC_ORIGIN 是網站本身的網域，不是 API 入口。
[env.production.vars]
ENVIRONMENT = "production"
PUBLIC_ORIGIN = "https://trip-planner-dby.pages.dev"

# Preview environment — Preview Deploy 使用（Pages 只支援 preview/production）
[env.preview]
[env.preview.vars]
ENVIRONMENT = "preview"
[[env.preview.d1_databases]]
binding = "DB"
database_name = "trip-planner-db-staging"
database_id = "53f38e2c-e17d-4961-ba9e-f61e63477ecc"
