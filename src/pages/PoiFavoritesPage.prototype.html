<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROTOTYPE — #1329 收藏批次核對</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#302721;background:#f6f1eb}*{box-sizing:border-box}body{margin:0}.app{display:flex;min-height:100vh}.side{width:210px;background:#fffaf5;border-right:1px solid #e3d7cb;padding:24px 18px;color:#7c6b5d}.side h2{color:#543d32;font-size:19px}.side p{padding:12px}.side .active{border-radius:10px;background:#f0dfd4;color:#773d28;font-weight:700}main{padding:26px;max-width:1020px;width:100%;margin:auto}h1{margin:0 0 4px;font-size:27px}.muted{color:#766d67}.search{display:block;width:100%;padding:13px 18px;border-radius:24px;border:1px solid #d6c7b8;background:white;font:inherit;margin:20px 0 12px}.filters{display:flex;gap:8px;margin:12px 0 22px}.filters button,.bar button,.switcher button{font:inherit;border:1px solid #c9b9aa;border-radius:24px;background:white;padding:9px 16px;color:#533d32;cursor:pointer}.filters .on{background:#a65d3f;color:white;border-color:#a65d3f}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#fffaf5;border:1px solid #e3d7cb;border-radius:14px;padding:16px;min-height:125px}.card strong{display:block;margin:10px 0 20px}.card label{display:block}.bar{position:sticky;bottom:16px;margin:24px auto 0;background:#fffaf5;border:1px solid #d6c7b8;box-shadow:0 10px 22px #482d231c;border-radius:18px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}.bar button:last-child,.danger{background:#a64c40!important;color:#fff!important;border-color:#a64c40!important}.review{display:none;position:fixed;inset:0;background:#1f151180;z-index:3;align-items:center;justify-content:center;padding:16px}.review.open{display:flex}.panel{background:#fffaf5;border-radius:18px;padding:22px;box-shadow:0 16px 40px #190e0d40;width:min(100%,460px);max-height:min(80vh,700px);overflow:auto}.panel h2{margin-top:0}.list{border:1px solid #e3d7cb;border-radius:12px;max-height:190px;overflow:auto;padding:8px 16px;margin:16px 0}.list div{padding:7px 0;border-bottom:1px solid #eee4db}.list div:last-child{border:0}.actions{display:flex;gap:8px;margin-top:20px}.actions button{flex:1;padding:11px;border-radius:24px;border:1px solid #d6c7b8;background:white;font:inherit;cursor:pointer}.variant-b .panel{width:min(100%,680px)}.variant-b .columns{display:grid;grid-template-columns:1fr 1fr;gap:12px}.variant-b .list{max-height:250px}.variant-c .review{align-items:stretch;justify-content:flex-end;padding:0}.variant-c .panel{height:100vh;max-height:none;width:min(420px,100%);border-radius:0}.variant-c .list{max-height:calc(100vh - 300px)}.switcher{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#26201e;color:white;padding:6px;border-radius:30px;display:flex;gap:8px;align-items:center;z-index:5;box-shadow:0 6px 18px #0005}.switcher button{padding:7px 12px}.switcher span{min-width:170px;text-align:center;font-size:14px}@media(max-width:700px){.side{display:none}main{padding:16px}.grid{grid-template-columns:1fr}.bar{bottom:70px;flex-wrap:wrap}.variant-b .columns{grid-template-columns:1fr}.switcher{bottom:8px}}
</style>
<div class="app"><aside class="side"><h2>Tripline</h2><p>行程</p><p>地圖</p><p class="active">收藏</p></aside><main><h1>收藏</h1><div class="muted">我的收藏 · 6 個收藏景點</div><input class="search" placeholder="搜尋收藏（名稱 / 地址 / 備註）" aria-label="搜尋收藏"><div class="filters"><button class="on">全部</button><button>餐廳</button><button>景點</button><button>住宿</button></div><div class="grid" id="cards"></div><div class="bar"><strong id="count">已選 3 個（含其他篩選）</strong><div><button id="all">全選目前顯示</button><button id="clear">取消</button><button class="danger" id="remove">移除</button></div></div></main></div>
<div class="review" id="review"><section class="panel" role="alertdialog" aria-modal="true"><h2>核對要移除的收藏</h2><p class="muted" id="intro"></p><div id="content"></div><p class="muted">景點本身不會被刪除；這次移除無法復原。</p><div class="actions"><button id="cancel">返回</button><button class="danger" id="confirm">確認移除</button></div></section></div><div class="switcher"><button id="prev" aria-label="上一方案">←</button><span id="variant"></span><button id="next" aria-label="下一方案">→</button></div>
<script>
// PROTOTYPE #1329. Three review layouts on the existing Favorites surface; no server mutations.
const rows=[['沖繩餐廳','餐廳'],['京都咖啡館','餐廳'],['大阪旅館','住宿'],['沖繩海灘','景點'],['東京公園','景點'],['京都塔','景點']];const selected=new Set([0,2,4]);const keys=['A','B','C'],labels={A:'A · 對話框清單',B:'B · 分類核對',C:'C · 側邊核對'};let key=new URLSearchParams(location.search).get('variant');if(!keys.includes(key))key='A';
function list(ids){return '<div class="list">'+ids.map(i=>'<div>'+rows[i][0]+' · '+rows[i][1]+'</div>').join('')+'</div>'}
function render(){document.body.className='variant-'+key.toLowerCase();document.querySelector('#variant').textContent=labels[key];document.querySelector('#cards').innerHTML=rows.map((r,i)=>'<article class="card"><span class="muted">'+r[1]+'</span><strong>'+r[0]+'</strong><label><input type="checkbox" data-id="'+i+'" '+(selected.has(i)?'checked':'')+'> 選取</label></article>').join('');document.querySelector('#count').textContent='已選 '+selected.size+' 個（含其他篩選）';document.querySelector('#intro').textContent='以下 '+selected.size+' 個收藏將被移除：';let ids=[...selected];document.querySelector('#content').innerHTML=key==='B'?'<div class="columns"><section><strong>餐廳 / 住宿</strong>'+list(ids.filter(i=>rows[i][1]!=='景點'))+'</section><section><strong>景點</strong>'+list(ids.filter(i=>rows[i][1]==='景點'))+'</section></div>':list(ids);document.querySelectorAll('[data-id]').forEach(el=>el.onchange=()=>{el.checked?selected.add(+el.dataset.id):selected.delete(+el.dataset.id);render()})}
function change(n){key=keys[(keys.indexOf(key)+n+3)%3];history.replaceState(null,'','?variant='+key);render()};document.querySelector('#prev').onclick=()=>change(-1);document.querySelector('#next').onclick=()=>change(1);document.onkeydown=e=>{if(e.target.closest('input,textarea,[contenteditable]'))return;if(e.key==='ArrowLeft')change(-1);if(e.key==='ArrowRight')change(1)};document.querySelector('#remove').onclick=()=>document.querySelector('#review').classList.add('open');document.querySelector('#cancel').onclick=()=>document.querySelector('#review').classList.remove('open');document.querySelector('#confirm').onclick=()=>{alert('Prototype：不會呼叫伺服器');document.querySelector('#review').classList.remove('open')};document.querySelector('#all').onclick=()=>{rows.forEach((_,i)=>selected.add(i));render()};document.querySelector('#clear').onclick=()=>{selected.clear();render()};render();
</script></html>
