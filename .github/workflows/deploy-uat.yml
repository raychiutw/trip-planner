name: Deploy — UAT D1 migrations

on:
  push:
    branches: [uat]
    paths:
      - 'migrations/**'
      - '.github/workflows/deploy-uat.yml'
  workflow_dispatch:

concurrency:
  group: d1-migrations-uat
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Compute pending migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute trip-planner-db-staging --remote --env preview --json \
            --command "SELECT name FROM d1_migrations" \
            | node scripts/d1-pending-migrations.js migrations > pending.txt
          cat pending.txt
      - name: Check migration safety
        run: bash scripts/check-migration-safety.sh --pending=pending.txt
      - name: Apply pending migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply trip-planner-db-staging --remote --env preview
