name: CI
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# v2.33.66 round 16 HIGH-1: minimal default permissions; supply-chain compromise
# under npm ci / npm test 拿不到 RW GITHUB_TOKEN。CI 純讀 repo + 跑 test，無寫需求。
permissions:
  contents: read

# 同一個 ref 只保留最新一次：PR 連推會取消舊的；master 不取消（每個合併都要有完整結果）。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    # 之前沒設，runner 失聯時燒了 55 分鐘才被判定。正常值：PR 約 30～40 分（含 mobile-safari）、master 全矩陣約 47 分。
    timeout-minutes: ${{ github.event_name == 'pull_request' && 60 || 70 }}
    steps:
      # v2.33.66 round 16 LOW-1: pin SHA + version comment (per OpenSSF Scorecard)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      # T19：契約（contracts/openapi.json）與已提交的 src/api/schema.d.ts 必須一致；
      # 契約改動沒重新產生型別就在這裡失敗，產生出的型別變動再由下面的 tsc 在編譯期擋住壞掉的呼叫端。
      - name: API contract (generated types in sync)
        run: npm run check:api-contract

      - name: TypeScript check (frontend)
        run: npx tsc --noEmit

      - name: TypeScript check (functions)
        run: npx tsc --noEmit -p tsconfig.functions.json

      # v2.54.5: react-hooks/exhaustive-deps gate — repo 原本無 ESLint，hook 依賴漏列
      # 無人擋（v2.54.4 customCategory 存錯 bug 即此類）。只跑 react-hooks 兩條規則。
      - name: Lint (react-hooks)
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify Service Worker
        run: node scripts/verify-sw.js

      - name: Bundle size gate (B-P6 task 11.3 / 6.4)
        run: bash scripts/bundle-size-check.sh
        env:
          THRESHOLD_KB: 300

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Playwright E2E (PR chromium + mobile-safari / main full matrix)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx playwright test --project=chromium --project=mobile-safari
          else
            npx playwright test
          fi

      # HIG 取證場景（觸控目標棘輪）：另開 config，因為需要第二份新 api 旗標建置；Build 步驟已建好主 dist，這裡只多建 dist-newapi。
      - name: Playwright HIG evidence (chromium)
        run: npx playwright test -c playwright.hig.config.js --project=chromium

      # 新 api 模式（旗標開啟）的 e2e：另建一份旗標開啟的 dist 並啟動本機假 api；不連外網、不用真實帳號。
      - name: Playwright new-api mode e2e (chromium)
        run: npx playwright test -c playwright.newapi.config.js
