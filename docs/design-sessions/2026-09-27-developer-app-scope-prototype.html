<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PROTOTYPE — Developer App scope choices</title>
<style>
/* Throwaway A/B/C scope comparison based on master f30dc75c DeveloperAppNewPage. */
:root{font-family:Inter,"Noto Sans TC",-apple-system,BlinkMacSystemFont,"PingFang TC",system-ui,sans-serif;--color-background:#FFFBF5;--color-secondary:#FAF4EA;--color-foreground:#2A1F18;--color-muted:#6F5A47;--color-border:#EADFCF;--color-border-control:#94795E;--color-accent:#A97A4A;--color-accent-fill:#8A6038;--color-accent-foreground:#fff;--color-focus-ring:#8A6038;--radius-md:8px;--radius-lg:12px;--radius-full:9999px;--spacing-tap-min:44px;--font-size-headline:1.0625rem;--font-size-footnote:.875rem;--font-size-caption2:.6875rem;--font-size-callout:1rem}
*{box-sizing:border-box}body{margin:0;background:var(--color-secondary);color:var(--color-foreground)}
button,input,textarea{font:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--color-focus-ring);outline-offset:2px;box-shadow:0 0 0 2px var(--color-background)}
.tp-dev-new-shell{min-height:100dvh;background:var(--color-secondary)}
.tp-titlebar{position:sticky;top:0;z-index:10;min-height:64px;display:flex;align-items:center;gap:12px;padding:0 24px;background:var(--color-background);border-bottom:1px solid var(--color-border)}
.tp-titlebar-back{width:44px;height:44px;border:0;background:transparent;color:var(--color-foreground);border-radius:var(--radius-md);font-size:22px}
.tp-titlebar-title{font-size:20px;margin:0;font-weight:700;flex:1}.tp-titlebar-action{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:var(--radius-md);background:var(--color-accent-fill);color:var(--color-accent-foreground);font-size:var(--font-size-footnote);font-weight:600;height:44px;padding:0 14px}.tp-titlebar-action svg{width:18px;height:18px}@media(max-width:760px){.tp-titlebar-action{width:44px;padding:0}.tp-titlebar-action-label{display:none}}
.tp-dev-new-inner{max-width:720px;margin:0 auto;padding:24px 16px 112px}.tp-dev-new-card{background:var(--color-background);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:28px 32px}
.tp-dev-new-intro h2{margin:0 0 6px;font-size:var(--font-size-headline);font-weight:800}.tp-dev-new-intro p{margin:0 0 24px;font-size:var(--font-size-footnote);color:var(--color-muted)}
.tp-form{display:flex;flex-direction:column;gap:16px}.tp-form-row{display:flex;flex-direction:column;gap:6px}.tp-form-row>label,.tp-dev-new-group>legend{font-size:var(--font-size-footnote);font-weight:600}.tp-hint{font-weight:400;color:var(--color-muted)}
.tp-form-row>input,.tp-form-row>textarea{width:100%;border:1px solid var(--color-border-control);border-radius:var(--radius-md);background:var(--color-background);color:var(--color-foreground);padding:10px 12px;min-height:44px}.tp-form-row>textarea{min-height:82px}
.tp-dev-new-group{border:0;padding:0;margin:0;min-width:0}.tp-dev-new-group>legend{width:100%;padding:0;margin-bottom:6px}
.tp-radio-group{display:flex;gap:8px}.tp-radio-card{flex:1;padding:12px;border:1px solid var(--color-border);border-radius:var(--radius-md);display:flex;gap:10px;align-items:center}.tp-radio-card-active{border:2px solid var(--color-accent);padding:11px}.tp-radio-card-content strong{display:block;font-size:var(--font-size-footnote)}.tp-radio-card-content span{font-size:var(--font-size-caption2);color:var(--color-muted)}
.scope{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:var(--font-size-footnote)}.scope input{accent-color:var(--color-accent-fill)}.note{font-size:var(--font-size-footnote);color:var(--color-muted);margin:8px 0 0}.group{border-top:1px solid var(--color-border);padding-top:12px;margin-top:16px}.group strong{font-size:var(--font-size-footnote)}.unsupported{opacity:.65}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--color-border-control);border-radius:var(--radius-md);padding:10px 12px;font-size:var(--font-size-footnote);min-height:44px}.chip.on{border-color:var(--color-accent);background:#F4EDE3}
.tp-page-bottom-bar{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;gap:8px;padding:12px 16px max(12px,env(safe-area-inset-bottom));background:var(--color-background);border-top:1px solid var(--color-border)}.tp-btn{display:inline-flex;align-items:center;justify-content:center;min-height:var(--spacing-tap-min);padding:10px 20px;border-radius:var(--radius-md);border:1px solid var(--color-border-control);background:var(--color-background);color:var(--color-foreground);font-weight:600;flex:1}.tp-btn-primary{background:var(--color-accent-fill);color:var(--color-accent-foreground);border-color:var(--color-accent-fill)}
.prototype-switcher{position:fixed;bottom:74px;left:50%;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:var(--radius-full);background:#2A1F18;color:#fff;box-shadow:0 4px 14px #0004;font-size:12px;white-space:nowrap}.prototype-switcher button{width:36px;height:36px;border:0;border-radius:50%;background:#fff;color:#2A1F18;font-size:20px}
@media(max-width:550px){.tp-titlebar{min-height:56px;padding:0 16px}.tp-titlebar-title{font-size:18px}.tp-dev-new-card{padding:22px 18px}.tp-radio-group{flex-direction:column}}
</style></head><body><div class="tp-dev-new-shell"><header class="tp-titlebar"><button class="tp-titlebar-back" type="button" aria-label="返回應用列表">←</button><h1 class="tp-titlebar-title">建立新應用</h1><button class="tp-titlebar-action" type="button" aria-label="建立" title="建立"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12l5 5L19 7"/></svg><span class="tp-titlebar-action-label">建立</span></button></header>
<main class="tp-dev-new-inner"><div class="tp-dev-new-card"><div class="tp-dev-new-intro"><h2>OAuth Client 設定</h2><p>填寫基本資訊，下一步將產生 client_id 與 client_secret。</p></div>
<form class="tp-form"><div class="tp-form-row"><label for="app-name">應用名稱 <span class="tp-hint">使用者會在同意畫面看到</span></label><input id="app-name" type="text" value="My Travel App"></div>
<div class="tp-form-row"><label for="redirect-uris">Redirect URIs <span class="tp-hint">每行一個，HTTPS only（localhost 例外）</span></label><textarea id="redirect-uris">https://example.com/auth/callback</textarea></div>
<fieldset class="tp-dev-new-group"><legend>類型</legend><div class="tp-radio-group"><label class="tp-radio-card tp-radio-card-active"><input type="radio" name="type" checked><span class="tp-radio-card-content"><strong>Public</strong><span>App 端 / SPA — 無 secret，PKCE 強制</span></span></label><label class="tp-radio-card"><input type="radio" name="type"><span class="tp-radio-card-content"><strong>Confidential</strong><span>Server-side — 配 client_secret</span></span></label></div></fieldset>
<fieldset class="tp-dev-new-group"><legend>申請的 scopes</legend><div id="choices"></div></fieldset></form></div></main>
<div class="tp-page-bottom-bar"><button class="tp-btn" type="button">取消</button><button class="tp-btn tp-btn-primary" type="button">建立應用</button></div></div>
<div class="prototype-switcher"><button id="prev" aria-label="上一版">‹</button><span id="variant"></span><button id="next" aria-label="下一版">›</button></div>
<script>
// Question: how should the existing scope section expose only scopes the server accepts?
// A: only supported choices, same checkbox pattern. B: explain unavailable Trip access.
// C: compact allowed-scope chips. All are visual prototypes only; no API calls.
const variants = ['A','B','C'];
const labels = { A:'A — 僅可申請的選項（建議）', B:'B — 未開放權限另列', C:'C — 緊湊選擇' };
const choice = (label, checked=false, disabled=false) => `<label class="scope ${disabled?'unsupported':''}"><input type="checkbox" ${checked?'checked':''} ${disabled?'disabled':''}><span>${label}</span></label>`;
function render() {
  const key = new URL(location.href).searchParams.get('variant') || 'A';
  document.getElementById('variant').textContent = labels[key] || labels.A;
  document.getElementById('choices').innerHTML = ({
    A: choice('openid — OIDC 識別',true)+choice('profile — 名稱/頭像',true)+choice('email — Email 地址',true)+choice('offline_access — 保持登入授權')+`<p class="note">目前可申請的權限由服務端審核。</p>`,
    B: `<strong>目前可申請</strong>`+choice('openid — OIDC 識別',true)+choice('profile — 名稱/頭像',true)+choice('email — Email 地址',true)+choice('offline_access — 保持登入授權')+`<div class="group"><strong>尚未開放</strong>`+choice('trips.read — 讀取行程',false,true)+choice('trips.write — 修改行程',false,true)+`<p class="note">行程權限目前無法透過開發者頁面申請。</p></div>`,
    C: `<p class="note">選取應用實際需要的 OpenID Connect 權限。</p><div class="chips"><label class="chip on"><input type="checkbox" checked> 識別 openid</label><label class="chip on"><input type="checkbox" checked> 個人資料 profile</label><label class="chip on"><input type="checkbox" checked> Email</label><label class="chip"><input type="checkbox"> 保持授權 offline_access</label></div>`,
  })[key] || '';
}
function move(step) { const u=new URL(location.href); const old=variants.indexOf(u.searchParams.get('variant')||'A'); u.searchParams.set('variant',variants[(old+step+3)%3]); history.replaceState(null,'',u); render(); }
document.getElementById('prev').onclick=()=>move(-1);
document.getElementById('next').onclick=()=>move(1);
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))return;if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);});
render();
</script>
</html>
