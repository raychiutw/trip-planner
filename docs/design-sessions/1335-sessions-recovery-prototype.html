<style>

ckground:var(--accent-subtle)}.device{display:flex;align-items:center;gap:12px;min-width:0}.device-icon{width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:8px;background:var(--surface)}.current .device-icon{background:var(--accent);color:white}.device-name{font-size:15px;font-weight:600}.pill{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:4px;background:#E7F2E4;color:var(--fg);font-size:10px;font-weight:700}.detail,.time-secondary{font-size:12px;color:var(--muted);margin-top:2px}.time-primary{font-size:14px;color:var(--fg)}.btn{min-height:44px;padding:8px 16px;border:1px solid #94795E;border-radius:999px;background:var(--bg);color:var(--fg);font-weight:600}.btn.danger{border-color:var(--error);color:var(--error)}.info{display:flex;gap:12px;padding:14px 16px;border-radius:8px;background:var(--accent-subtle);color:#7A5430;font-size:15px;line-height:1.5;margin-top:16px}.info a{color:var(--accent)}.footer{margin-top:32px;padding:20px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg)}.footer .btn{width:100%}.page-error{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:32px 24px;text-align:center}.page-error h2{font-size:17px;margin:0 0 8px}.page-error p{font-size:14px;color:var(--muted);margin:0 0 16px}.page-error .actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.page-error .btn:first-child{background:var(--surface);color:var(--fg);border-color:#94795E}.page-error.in-list{border:0;border-radius:0}.page-error.centered{max-width:560px;margin:24px auto}.page-error.full{min-height:190px;display:flex;flex-direction:column;justify-content:center}.empty-list{height:100px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);margin-top:12px}.mobile-nav{display:none}.switcher{position:fixed;z-index:10;left:50%;bottom:12px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:6px;border-radius:999px;background:#1C1C1E;color:white;box-shadow:0 8px 28px #0004}.switcher button{width:40px;height:40px;border:0;border-radius:999px;background:#3A3A3C;color:white}.switcher label{font-size:12px;white-space:nowrap}.switcher select{min-height:36px;border:0;border-radius:8px;background:#3A3A3C;color:white}
@media(max-width:1023px){.shell{display:block}.sidebar{display:none}.main-column{height:100dvh}.mobile-nav{display:flex;position:fixed;z-index:3;left:50%;bottom:16px;transform:translateX(-50%);padding:6px;gap:2px;border:1px solid #fff9;border-radius:999px;background:var(--tabbar);backdrop-filter:blur(28px) saturate(190%);box-shadow:0 8px 28px #2a1f1829}.mobile-nav span{width:62px;min-height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:999px;color:var(--muted);font-size:10px;font-weight:700}.mobile-nav b{font-size:20px;font-weight:400}.switcher{bottom:82px}}
@media(max-width:760px){.titlebar{height:56px;padding:0 16px}.titlebar h1{font-size:18px;line-height:24px}.title-action{width:44px;padding:0;justify-content:center}.title-action .label{display:none}.row{grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:14px}.row.header{display:none}.row.header.error-header{display:grid;grid-template-columns:minmax(0,1fr) auto}.row.header.error-header div:last-child{display:none}.row .activity{grid-column:1;grid-row:2;margin-left:48px}.row .action{grid-column:2;grid-row:1/3}.device-name{overflow-wrap:anywhere}.content{padding-bottom:110px}.switcher label{max-width:94px;overflow:hidden;text-overflow:ellipsis}}
@media(max-width:350px){.switcher{gap:3px}.switcher select{max-width:76px}}

<body>
<!-- PROTOTYPE only: compare session date hierarchy and recovery placement in the existing page. -->
<div class="shell"><aside class="sidebar"><div class="brand">Tripline</div><span class="side-item">聊天</span><span class="side-item">行程</span><span class="side-item">地圖</span><span class="side-item">我的收藏</span><span class="side-item active">帳號</span></aside><div class="main-column"><header class="titlebar"><button class="back" type="button" aria-label="返回帳號" onclick="alert('Prototype：返回帳號')">←</button><h1>登入裝置</h1><button id="sessionAction" class="title-action" type="button" aria-label="登出其他全部裝置" title="登出其他全部裝置"><span class="icon" aria-hidden="true">⇥</span><span class="label">登出其他裝置</span></button></header><main class="content"><p class="eyebrow">帳號</p><p class="meta">ray@example.com</p><div id="variant"></div><div class="info"><span aria-hidden="true">ⓘ</span><span>登出某裝置後，該裝置上的 Tripline 會立即跳回登入畫面。OAuth 已連結 app 不受影響（請至「<a href="#" onclick="return false">已連結的應用</a>」管理）。</span></div><div class="footer"><button class="btn danger" type="button">登出此帳號</button></div></main></div></div>
<nav class="mobile-nav" aria-label="頁面導覽參照"><span><b>♧</b>聊天</span><span><b>⌂</b>行程</span><span><b>▤</b>地圖</span><span><b>♡</b>收藏</span></nav>

<nav class="switcher" aria-label="Prototype variants"><button id="prev" aria-label="上一方案">←</button><label id="variantLabel"></label><select id="state" aria-label="畫面狀態"><option value="ready">列表</option><option value="error">讀取失敗</option></select><button id="next" aria-label="下一方案">→</button></nav>
<script>
const variants=['A','B','C'],names={A:'表格內恢復',B:'完整內容區',C:'置中恢復卡'};const params=new URLSearchParams(location.search);let variant=variants.includes(params.get('variant'))?params.get('variant'):'A',state=params.get('state')==='error'?'error':'ready';
const when=v=>v==='A'?['剛才','2026/4/25 下午 7:59','3 小時前','2026/4/25 上午 9:00']:v==='B'?['剛才 · 2026/4/25 下午 7:59','','3 小時前 · 2026/4/25 上午 9:00','']:['2026/4/25 下午 7:59','剛才','2026/4/25 上午 9:00','3 小時前'];
function row(name,current,created,primary,secondary){return `<div class="row ${current?'current':''}"><div class="device"><span class="device-icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8m-4-4v4"/></svg></span><div><div class="device-name">${name}${current?'<span class="pill">目前</span>':''}</div><div class="detail">建立 ${created} · 裝置 ID a1b2…</div></div></div><div class="activity"><div class="time-primary">${primary}</div>${secondary?`<div class="time-secondary">${secondary}</div>`:''}</div><div class="action">${current?'':'<button class="btn danger" type="button">登出</button>'}</div></div>`}
function ready(){const t=when(variant);return `<div class="list"><div class="row header"><div>裝置</div><div>上次活動</div><div></div></div>${row('Chrome on macOS',true,'2026/4/23 上午 8:00',t[0],t[1])}${row('Safari on iOS',false,'2026/4/20 下午 2:30',t[2],t[3])}</div>`}
function failure(){const card=`<div class="page-error ${variant==='A'?'in-list':variant==='B'?'full':'centered'}" role="alert"><h2>無法載入登入裝置</h2><p>目前無法確認登入裝置；登入狀態尚未改變。</p><div class="actions"><button class="btn" type="button" onclick="alert('Prototype：重新讀取，不呼叫 API')">重新載入裝置</button><button class="btn" type="button" onclick="alert('Prototype：返回帳號')">返回帳號</button></div></div>`;return variant==='A'?`<div class="list"><div class="row header error-header"><div>裝置</div><div>上次活動</div><div></div></div>${card}</div>`:variant==='B'?card+'<div class="empty-list" aria-hidden="true"></div>':card}
function render(){document.getElementById('variant').innerHTML=state==='ready'?ready():failure();document.getElementById('variantLabel').textContent=`${variant} — ${names[variant]}`;document.getElementById('state').value=state;document.getElementById('sessionAction').hidden=state==='error';params.set('variant',variant);params.set('state',state);history.replaceState(null,'',`${location.pathname}?${params}`)}
function cycle(step){variant=variants[(variants.indexOf(variant)+step+variants.length)%variants.length];render()}document.getElementById('prev').onclick=()=>cycle(-1);document.getElementById('next').onclick=()=>cycle(1);document.getElementById('state').onchange=e=>{state=e.target.value;render()};document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)||document.activeElement?.isContentEditable)return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});render();
</script>
</body></html>
