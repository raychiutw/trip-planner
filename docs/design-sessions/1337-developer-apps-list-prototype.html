<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROTOTYPE — #1337 開發者應用清單</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#302922;background:#f6f3ee}*{box-sizing:border-box}body{margin:0}.shell{min-height:100dvh;display:grid;grid-template-columns:240px 1fr}aside{background:#fff;border-right:1px solid #e5ded6;padding:30px 20px;color:#6c6259}aside strong{display:block;color:#302922;font-size:20px;margin-bottom:36px}aside p{padding:12px;border-radius:10px}aside p.selected{background:#f3ece3;color:#784c35;font-weight:700}main{padding:30px 24px 100px;max-width:1060px;width:100%;margin:auto}.back{font-size:14px;color:#6c6259}.heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:10px 0 26px}.heading h1{font-size:30px;letter-spacing:-.03em;margin:0}.eyebrow{font-size:12px;letter-spacing:.12em;color:#84776b;font-weight:700;margin:0 0 6px}.meta{color:#6c6259;margin:0 0 24px;font-size:14px}.note{font-size:13px;color:#62574e;border-left:3px solid #9f785d;padding:3px 12px;margin:22px 0 18px}.note strong{display:block;color:#40352d;margin-bottom:3px}button{font:inherit;cursor:pointer}.primary{border:0;border-radius:999px;background:#80523b;color:#fff;padding:10px 18px;font-weight:700;min-height:44px}.secondary{border:1px solid #d9cfc4;background:#fff;color:#594a3c;border-radius:999px;padding:9px 15px;min-height:44px}.primary:focus-visible,.secondary:focus-visible,a:focus-visible{outline:3px solid #8a6046;outline-offset:2px}.list{background:#fff;border:1px solid #e3dcd3;border-radius:16px;overflow:hidden}.row{display:grid;grid-template-columns:minmax(0,2fr) minmax(88px,.6fr) minmax(92px,.6fr);gap:16px;align-items:start;padding:16px 20px;border-bottom:1px solid #eee8e1}.row:last-child{border-bottom:0}.header{background:#f5f1eb;color:#71665c;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:800}.name{font-weight:700;overflow-wrap:anywhere}.id{color:#71675e;font-family:ui-monospace,monospace;font-size:12px;overflow-wrap:anywhere;margin-top:5px}.uri{font-size:12px;color:#594a3c;margin-top:7px;overflow-wrap:anywhere}.uri .secondary{margin-top:7px}.uri a{color:#80523b;word-break:break-all}.label{color:#766d64;font-size:11px;font-weight:700;margin-bottom:3px}.pill{display:inline-block;background:#e7efe8;color:#364638;border-radius:6px;padding:3px 7px;font-size:11px;font-weight:700}.date{font-size:13px;color:#5d544c}.cardgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid #e3dcd3;border-radius:16px;padding:18px;min-width:0}.card .meta-line{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:13px}.error{border:1px solid #c46b59;background:#faece8;color:#802f23;border-radius:12px;padding:18px}.error strong{display:block;font-size:17px}.error p{margin:6px 0 14px}.error.inline{border:0;border-radius:0;padding:26px}.error.bar{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:16px}.error.bar p{margin:4px 0 0}.error.center{text-align:center;max-width:560px;margin:34px auto;padding:42px 24px}.error.center .mark{font-size:30px;margin-bottom:12px}.empty{background:#fff;border:1px solid #e3dcd3;border-radius:16px;text-align:center;padding:56px 20px}.empty h2{font-size:18px;margin:0 0 6px}.empty p{font-size:13px;color:#766d64;margin:0 0 17px}.blank{height:130px;background:#fff;border:1px dashed #d6c7b7;border-radius:12px}.table-scroll{max-width:100%;overflow-x:auto;border-radius:16px}.table-scroll .list{min-width:810px}.table-scroll .row{grid-template-columns:300px 250px 90px 100px}.table-scroll .uri{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.scroll-hint{font-size:12px;color:#766d64;margin:0 0 7px}.switcher{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:7px;background:#292420;color:#fff;border-radius:999px;box-shadow:0 10px 30px #0005;z-index:10}.switcher button{border:0;border-radius:999px;background:#53493f;color:#fff;width:40px;height:40px}.switcher label{font-size:12px;margin:0 7px;white-space:nowrap}.switcher select{font:inherit;color:#fff;background:#53493f;border:0;border-radius:8px;padding:7px}
@media(max-width:760px){.shell{display:block}aside{display:none}main{padding:18px 14px 110px}.heading h1{font-size:25px}.heading .primary{font-size:12px;padding:8px 10px}.row{grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:14px}.row.header{display:none}.row .app{grid-column:1/3}.row .status{grid-column:1}.row .created{grid-column:2;text-align:right}.cardgrid{grid-template-columns:1fr}.error.bar{display:block}.error.bar button{margin-top:6px}.switcher{width:min(96vw,420px);justify-content:center}.switcher label{margin:0}}
</style>
</head>
<body>
<!-- PROTOTYPE only. Question: how should long metadata, read failure, and 403 fit the existing Developer Apps page? -->
<div class="shell"><aside><strong>Tripline</strong><p>行程</p><p>地圖</p><p>收藏</p><p class="selected">帳號設定</p></aside><main><div class="back">‹ 返回帳號</div><div class="heading"><h1>應用</h1><button id="createHeader" class="primary">建立新應用</button></div><p class="eyebrow">開發者後台</p><p class="meta">管理你的 OAuth client。每個應用程式對應一組 client_id。</p><div id="variant"></div></main></div>
<nav class="switcher" aria-label="Prototype variants"><button id="prev" aria-label="上一方案">←</button><label id="variantLabel"></label><select id="state"><option value="list">長清單</option><option value="empty">空清單</option><option value="error">讀取失敗</option><option value="forbidden">無權限</option></select><button id="next" aria-label="下一方案">→</button></nav>
<script>
const variants=['A','B','C'],names={A:'響應式清單',B:'可捲動表格',C:'卡片清單'},params=new URLSearchParams(location.search);let variant=variants.includes(params.get('variant'))?params.get('variant'):'A',state=['list','empty','error','forbidden'].includes(params.get('state'))?params.get('state'):'list';
const longName='A very long developer application name for a travel integration with many words and no clear short form',clientId='tp_'+('a'.repeat(55)),uri='https://example.com/a/very/long/path/to/the/oauth/callback/endpoint?tenant=tripline-and-state=long';
const app=()=>`<div class="app"><div class="name">${longName}</div><div class="id">${clientId}</div><div class="uri"><span class="label">重新導向 URI</span><br><span>${uri}</span><br><button class="secondary" onclick="alert('Prototype：複製 URI；不開啟 callback endpoint')">複製 URI</button></div></div>`;
const row=()=>`<div class="row">${app()}<div class="status"><div class="label">狀態</div><span class="pill">使用中</span></div><div class="created"><div class="label">建立日期</div><span class="date">2026/9/20</span></div></div>`;
const tableRow=()=>`<div class="row"><div><div class="name">${longName}</div><div class="id">${clientId}</div></div><div class="uri"><a href="${uri}" onclick="event.preventDefault();alert('Prototype：不開啟 callback URI')">${uri}</a></div><div><span class="pill">使用中</span></div><div class="date">2026/9/20</div></div>`;
const notes={A:'桌機沿用表格；手機將每個應用排成可換行的清單列，完整顯示名稱、ID、URI、狀態和日期。',B:'維持四欄寬表格，手機可左右捲動；長 URI 在欄內省略。',C:'每個應用都是獨立卡片，桌機兩欄、手機一欄。'};
function render(){const host=document.getElementById('variant');document.getElementById('variantLabel').textContent=`${variant} — ${names[variant]}`;document.getElementById('state').value=state;document.getElementById('createHeader').hidden=state==='forbidden';params.set('variant',variant);params.set('state',state);history.replaceState(null,'',`${location.pathname}?${params}`);const note=`<p class="note"><strong>${names[variant]}</strong>${notes[variant]}</p>`;
 if(state==='list'){host.innerHTML=note+(variant==='C'?`<div class="cardgrid"><div class="card">${app()}<div class="meta-line"><span class="pill">使用中</span><span class="date">建立 2026/9/20</span></div></div></div>`:variant==='B'?`<p class="scroll-hint">左右捲動查看更多欄位 →</p><div class="table-scroll"><div class="list"><div class="row header"><div>應用</div><div>重新導向 URI</div><div>狀態</div><div>建立日期</div></div>${tableRow()}</div></div>`:`<div class="list"><div class="row header"><div>應用</div><div>狀態</div><div>建立日期</div></div>${row()}</div>`);return}
 if(state==='empty'){host.innerHTML=note+`<div class="empty"><h2>尚未建立任何應用</h2><p>建立第一個 OAuth client 來接入「Sign in with Tripline」。</p><button class="primary">建立第一個應用</button></div>`;return}
 const retry='<button class="primary" onclick="alert(\'Prototype：重新讀取；不呼叫真實 API。\')">重新載入應用</button>';
 if(state==='forbidden'){host.innerHTML=note+`<div class="error ${variant==='C'?'center':variant==='B'?'bar':'inline'}" role="alert"><div><strong>無法管理開發者應用</strong><p>目前帳號沒有這項權限。請切換到有權限的帳號。</p></div></div>`;return}
 host.innerHTML=note+(variant==='A'?`<div class="list"><div class="error inline" role="alert"><strong>無法載入應用清單</strong><p>目前無法確認已建立的應用。稍後可重試，既有資料不會被清空。</p>${retry}</div></div>`:variant==='B'?`<div class="error bar" role="alert"><div><strong>無法載入應用清單</strong><p>目前無法確認已建立的應用。</p></div>${retry}</div><div class="blank"></div>`:`<div class="error center" role="alert"><div class="mark" aria-hidden="true">!</div><strong>暫時無法查看開發者應用</strong><p>請檢查連線後重試。既有應用沒有被刪除。</p>${retry}</div>`)}
document.getElementById('prev').onclick=()=>{variant=variants[(variants.indexOf(variant)+2)%3];render()};document.getElementById('next').onclick=()=>{variant=variants[(variants.indexOf(variant)+1)%3];render()};document.getElementById('state').onchange=e=>{state=e.target.value;render()};document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)||document.activeElement?.isContentEditable)return;if(e.key==='ArrowLeft'){variant=variants[(variants.indexOf(variant)+2)%3];render()}if(e.key==='ArrowRight'){variant=variants[(variants.indexOf(variant)+1)%3];render()}});render();
</script>
</body></html>
