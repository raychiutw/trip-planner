*{box-sizing:border-box}body{margin:0}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:2px}.shell{height:100dvh;display:grid;grid-template-columns:216px minmax(0,1fr)}.sidebar{padding:24px 12px;background:var(--bg);border-right:1px solid var(--border)}.brand{font-size:20px;font-weight:700;margin:0 12px 24px}.side-item{display:block;padding:12px;border-radius:8px;color:var(--muted)}.side-item.active{background:var(--accent-subtle);color:var(--accent);font-weight:700}.main-column{min-width:0;overflow-y:auto;background:var(--surface)}.titlebar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;height:64px;padding:0 24px;border-bottom:1px solid var(--border);background:var(--tabbar);backdrop-filter:blur(28px) saturate(190%)}.titlebar h1{font-size:20px;line-height:28px;letter-spacing:-.01em;margin:0;flex:1}.back{width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:8px;background:transparent;color:var(--fg);font-size:20px}.title-action{min-height:44px;display:flex;align-items:center;gap:6px;padding:0 14px;border:0;border-radius:8px;background:transparent;color:var(--fg);font-size:14px;font-weight:600}.title-action .icon{font-size:18px}.content{max-width:920px;margin:auto;padding:16px 16px 64px}.eyebrow{margin:0 0 4px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700}.meta{margin:0 0 16px;font-size:14px;line-height:1.5;color:var(--muted)}.list{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}.row{display:grid;grid-template-columns:minmax(0,1fr) 160px auto;gap:16px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}.row:last-child{border-bottom:0}.row.header{background:var(--surface);color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}.row.current{background:var(--accent-subtle)}.device{display:flex;align-items:center;gap:12px;min-width:0}.device-icon{width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:8px;background:var(--surface)}.current .device-icon{background:var(--accent);color:white}.device-name{font-size:15px;font-weight:600}.pill{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:4px;background:#E7F2E4;color:var(--fg);font-size:10px;font-weight:700}.detail,.time-secondary{font-size:12px;color:var(--muted);margin-top:2px}.time-primary{font-size:14px;color:var(--fg)}.btn{min-height:44px;padding:8px 16px;border:1px solid #94795E;border-radius:999px;background:var(--bg);color:var(--fg);font-weight:600}.btn.danger{border-color:var(--error);color:var(--error)}.info{display:flex;gap:12px;padding:14px 16px;border-radius:8px;background:var(--accent-subtle);color:#7A5430;font-size:15px;line-height:1.5;margin-top:16px}.info a{color:var(--accent)}.footer{margin-top:32px;padding:20px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg)}.footer .btn{width:100%}.page-error{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:32px 24px;text-align:center}.page-error h2{font-size:17px;margin:0 0 8px}.page-error p{font-size:14px;color:var(--muted);margin:0 0 16px}.page-error .actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.page-error .btn:first-child{background:var(--surface);color:var(--fg);border-color:#94795E}.page-error.in-list{border:0;border-radius:0}.page-error.centered{max-width:560px;margin:24px auto}.page-error.full{min-height:190px;display:flex;flex-direction:column;justify-content:center}.empty-list{height:100px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);margin-top:12px}.mobile-nav{display:none}.switcher{position:fixed;z-index:10;left:50%;bottom:12px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:6px;border-radius:999px;background:#1C1C1E;color:white;box-shadow:0 8px 28px #0004}.switcher button{width:40px;height:40px;border:0;border-radius:999px;background:#3A3A3C;color:white}.switcher label{font-size:12px;white-space:nowrap}.switcher select{min-height:36px;border:0;border-radius:8px;background:#3A3A3C;color:white}
@media(max-width:1023px){.shell{display:block}.sidebar{display:none}.main-column{height:100dvh}.mobile-nav{display:flex;position:fixed;z-index:3;left:50%;bottom:16px;transform:translateX(-50%);padding:6px;gap:2px;border:1px solid #fff9;border-radius:999px;background:var(--tabbar);backdrop-filter:blur(28px) saturate(190%);box-shadow:0 8px 28px #2a1f1829}.mobile-nav span{width:62px;min-height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:999px;color:var(--muted);font-size:10px;font-weight:700}.mobile-nav b{font-size:20px;font-weight:400}.switcher{bottom:82px}}
@media(max-width:760px){.titlebar{height:56px;padding:0 16px}.titlebar h1{font-size:18px;line-height:24px}.title-action{width:44px;padding:0;justify-content:center}.title-action .label{display:none}.row{grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:14px}.row.header{display:none}.row .activity{grid-column:1;grid-row:2;margin-left:48px}.row .action{grid-column:2;grid-row:1/3}.device-name{overflow-wrap:anywhere}.content{padding-bottom:110px}.switcher label{max-width:94px;overflow:hidden;text-overflow:ellipsis}}
@media(max-width:350px){.switcher{gap:3px}.switcher select{max-width:76px}}

.app-list{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}.app-row{display:grid;grid-template-columns:minmax(0,2fr) minmax(88px,1fr) minmax(96px,1fr);gap:16px;padding:14px 20px;align-items:center;border-bottom:1px solid var(--border)}.app-row:last-child{border-bottom:0}.app-row.header{background:var(--surface);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.app-name{font-size:15px;font-weight:600;overflow-wrap:anywhere}.app-id,.uri{font-size:12px;overflow-wrap:anywhere;color:var(--muted);margin-top:4px}.uri{color:var(--fg);margin-top:8px}.label{font-size:12px;color:var(--muted);font-weight:600}.uri-value{overflow-wrap:anywhere}.status-pill{display:inline-block;background:#E7F2E4;color:var(--fg);border-radius:4px;padding:2px 8px;font-size:10px;font-weight:700}.created{font-size:14px;color:var(--muted)}.app-cardgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.app-card{min-width:0;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px}.app-card .bottom{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:14px}.table-scroll{max-width:100%;overflow-x:auto;border-radius:var(--radius)}.table-scroll .app-list{min-width:760px}.table-scroll .app-row{grid-template-columns:270px 260px 90px 95px}.table-scroll .uri-value{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.scroll-hint{font-size:12px;color:var(--muted);margin:0 0 6px}.empty{padding:48px 20px;text-align:center;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius)}.empty h2{font-size:17px;margin:0 0 6px}.empty p{font-size:14px;color:var(--muted);margin:0 0 16px}.global-banner{max-width:920px;margin:16px auto 0;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;background:var(--error-bg);border:1px solid var(--error);border-radius:8px;color:var(--error);font-size:15px;line-height:1.5}.global-banner span:first-child{font-size:18px;line-height:1.1}.copy{min-height:44px;margin-top:6px}.table-scroll .copy{display:none}.title-action[hidden],.global-banner[hidden]{display:none}
@media(max-width:760px){.app-row{grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:14px}.app-row.header{display:none}.app-row .app{grid-column:1/3}.app-row .status{grid-column:1}.app-row .created{text-align:right}.app-cardgrid{grid-template-columns:1fr}.global-banner{margin:16px 16px 0}}
</style></head>
<body>
<!-- PROTOTYPE only: compare long metadata layouts in the existing Developer Apps page. -->
<div class="shell"><aside class="sidebar"><div class="brand">Tripline</div><span class="side-item">聊天</span><span class="side-item">行程</span><span class="side-item">地圖</span><span class="side-item">我的收藏</span><span class="side-item active">帳號</span></aside><div class="main-column"><header class="titlebar"><button class="back" type="button" aria-label="返回帳號" onclick="alert('Prototype：返回帳號')">←</button><h1>應用</h1><button id="createHeader" class="title-action" type="button" aria-label="建立新應用" title="建立新應用"><span class="icon" aria-hidden="true">＋</span><span class="label">建立新應用</span></button></header><div id="permission" class="global-banner" role="alert" hidden><span aria-hidden="true">⚠</span><span>沒有權限查看開發者應用，請返回帳號。</span></div><main class="content"><p class="eyebrow">開發者後台</p><p class="meta">管理你的 OAuth client。每個應用程式對應一組 client_id。</p><div id="variant"></div></main></div></div>
<nav class="mobile-nav" aria-label="頁面導覽參照"><span><b>♧</b>聊天</span><span><b>⌂</b>行程</span><span><b>▤</b>地圖</span><span><b>♡</b>收藏</span></nav>

<nav class="switcher" aria-label="Prototype variants"><button id="prev" aria-label="上一方案">←</button><label id="variantLabel"></label><select id="state" aria-label="畫面狀態"><option value="list">長清單</option><option value="empty">空清單</option><option value="error">讀取失敗</option><option value="forbidden">無權限</option></select><button id="next" aria-label="下一方案">→</button></nav>
<script>
const variants=['A','B','C'],names={A:'響應式清單',B:'可捲動表格',C:'卡片清單'},params=new URLSearchParams(location.search);let variant=variants.includes(params.get('variant'))?params.get('variant'):'A',state=['list','empty','error','forbidden'].includes(params.get('state'))?params.get('state'):'list';
const longName='A very long developer application name for a travel integration with many words and no clear short form',clientId='tp_'+('a'.repeat(55)),uri='https://example.com/a/very/long/path/to/the/oauth/callback/endpoint?tenant=tripline-and-state=long';
const copy=`<button type="button" class="btn copy" onclick="alert('Prototype：複製 URI，不存取剪貼簿')">複製 URI</button>`;
const app=()=>`<div class="app"><div class="app-name">${longName}</div><div class="app-id">${clientId}</div><div class="uri"><span class="label">重新導向 URI</span><div class="uri-value">${uri}</div>${copy}</div></div>`;
const row=()=>`<div class="app-row">${app()}<div class="status"><span class="label">狀態</span><br><span class="status-pill">使用中</span></div><div class="created"><span class="label">建立日期</span><br>2026/9/20</div></div>`;
const tableRow=()=>`<div class="app-row"><div><div class="app-name">${longName}</div><div class="app-id">${clientId}</div></div><div class="uri"><div class="uri-value" title="${uri}">${uri}</div></div><div><span class="status-pill">使用中</span></div><div class="created">2026/9/20</div></div>`;
function list(){if(variant==='C')return `<div class="app-cardgrid"><div class="app-card">${app()}<div class="bottom"><span class="status-pill">使用中</span><span class="created">建立 2026/9/20</span></div></div></div>`;if(variant==='B')return `<p class="scroll-hint">左右捲動查看更多欄位 →</p><div class="table-scroll"><div class="app-list"><div class="app-row header"><div>應用</div><div>重新導向 URI</div><div>狀態</div><div>建立日期</div></div>${tableRow()}</div></div>`;return `<div class="app-list"><div class="app-row header"><div>應用</div><div>狀態</div><div>建立日期</div></div>${row()}</div>`}
function failure(){const card=`<div class="page-error ${variant==='A'?'in-list':variant==='B'?'full':'centered'}" role="alert"><h2>無法載入應用列表</h2><p>資料暫時無法取得，請重試。</p><div class="actions"><button class="btn" type="button" onclick="alert('Prototype：重新讀取，不呼叫 API')">重新載入應用列表</button><button class="btn" type="button" onclick="alert('Prototype：返回帳號')">返回帳號</button></div></div>`;return variant==='A'?`<div class="app-list">${card}</div>`:variant==='B'?card+'<div class="empty-list" aria-hidden="true"></div>':card}
function render(){document.getElementById('variantLabel').textContent=`${variant} — ${names[variant]}`;document.getElementById('state').value=state;const action=document.getElementById('createHeader');action.hidden=state==='forbidden';action.setAttribute('aria-label',state==='error'?'重新載入應用列表':'建立新應用');action.title=state==='error'?'重新載入應用列表':'建立新應用';action.querySelector('.icon').textContent=state==='error'?'↻':'＋';action.querySelector('.label').textContent=state==='error'?'重新載入應用列表':'建立新應用';document.getElementById('permission').hidden=state!=='forbidden';document.getElementById('variant').innerHTML=state==='list'?list():state==='empty'?`<div class="empty"><h2>尚未建立任何應用</h2><p>建立第一個 OAuth client 來接入「Sign in with Tripline」。</p><button class="btn" type="button">建立第一個應用</button></div>`:state==='error'?failure():'';params.set('variant',variant);params.set('state',state);history.replaceState(null,'',`${location.pathname}?${params}`)}
function cycle(step){variant=variants[(variants.indexOf(variant)+step+variants.length)%variants.length];render()}document.getElementById('prev').onclick=()=>cycle(-1);document.getElementById('next').onclick=()=>cycle(1);document.getElementById('state').onchange=e=>{state=e.target.value;render()};document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)||document.activeElement?.isContentEditable)return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});render();
</script></body></html>
